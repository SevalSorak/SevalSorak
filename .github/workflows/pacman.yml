name: Generate Pac-Man

on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - profile-redesign-holographic

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: SevalSorak
          github_token: ${{ secrets.PROFILE_ACTIVITY_TOKEN || github.token }}
          theme: github-dark
          output: dist/pacman-contribution-graph.svg

      - name: Publish generated graph
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
