name: Update Activity Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - main
      - profile-redesign-holographic
    paths:
      - "scripts/generate_activity_pulse.py"
      - ".github/workflows/activity-pulse.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate activity pulse from public GitHub events
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR_TARGET: SevalSorak
        run: python scripts/generate_activity_pulse.py

      - name: Commit updated pulse
        run: |
          if git diff --quiet -- assets/activity-pulse.svg; then
            echo "Activity pulse is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-pulse.svg
          git commit -m "chore: update activity pulse"
          git push
