<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Seval Sorak core focus tech sphere">
<defs>
  <radialGradient id="sbg" cx=".5" cy=".5" r=".7">
    <stop offset="0" stop-color="#16203d"/>
    <stop offset=".65" stop-color="#0b1020"/>
    <stop offset="1" stop-color="#050712"/>
  </radialGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#38bdf8" stop-opacity=".25"/>
    <stop offset=".65" stop-color="#8b5cf6" stop-opacity=".08"/>
    <stop offset="1" stop-color="#050712" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset=".5" stop-color="#8b5cf6"/>
    <stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
</defs>
<rect width="1200" height="420" rx="24" fill="#050712"/>
<g stroke="#141b33" stroke-width=".6">
  <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/><line x1="0" y1="315" x2="1200" y2="315"/>
  <line x1="240" y1="0" x2="240" y2="420"/><line x1="480" y1="0" x2="480" y2="420"/><line x1="720" y1="0" x2="720" y2="420"/><line x1="960" y1="0" x2="960" y2="420"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="54" y="64" font-size="13" font-weight="700" fill="#67e8f9" letter-spacing="4">CORE FOCUS AREAS</text>
  <text x="54" y="116" font-size="42" font-weight="800" fill="#f8fafc">What I build around</text>
  <text x="54" y="152" font-size="17" fill="#94a3b8">AI systems, models, applications and the software that ships them.</text>
  <g font-size="14" fill="#cbd5e1">
    <text x="54" y="218">Generative AI &amp; LLMs</text>
    <text x="54" y="252">Machine Learning</text>
    <text x="54" y="286">Computer Vision</text>
    <text x="260" y="218">AI Agents</text>
    <text x="260" y="252">Backend Systems</text>
    <text x="260" y="286">Data Science</text>
  </g>
</g>
<line x1="510" y1="58" x2="510" y2="362" stroke="#1e293b"/>

<g transform="translate(860,210)" font-family="ui-monospace,Consolas,monospace">
  <circle r="195" fill="url(#halo)"/>
  <circle r="146" fill="url(#sbg)" stroke="url(#rim)" stroke-width="1.4"/>
  <g opacity=".75">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    <ellipse rx="146" ry="48" fill="none" stroke="#22d3ee" stroke-width=".8"/>
    <ellipse rx="146" ry="48" fill="none" stroke="#8b5cf6" stroke-width=".7" transform="rotate(60)"/>
    <ellipse rx="146" ry="48" fill="none" stroke="#f472b6" stroke-width=".7" transform="rotate(120)"/>
    <ellipse rx="66" ry="146" fill="none" stroke="#38bdf8" stroke-width=".6"/>
    <ellipse rx="112" ry="146" fill="none" stroke="#a78bfa" stroke-width=".6"/>
  </g>
  <g font-size="13" font-weight="700">
    <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="24s" repeatCount="indefinite"/>
    <g transform="translate(-122,-52)"><circle r="3" fill="#22d3ee"/><text x="10" y="4" fill="#67e8f9">PyTorch</text></g>
    <g transform="translate(-62,-126)"><circle r="3" fill="#22d3ee"/><text x="10" y="4" fill="#67e8f9">FastAPI</text></g>
    <g transform="translate(-122,70)"><circle r="3" fill="#22d3ee"/><text x="10" y="4" fill="#67e8f9">OpenCV</text></g>
    <g transform="translate(84,-100)"><circle r="3" fill="#a78bfa"/><text x="10" y="4" fill="#c4b5fd">LLMs</text></g>
    <g transform="translate(112,64)"><circle r="3" fill="#f472b6"/><text x="-10" y="4" text-anchor="end" fill="#f9a8d4">Agents</text></g>
    <g transform="translate(22,130)"><circle r="3" fill="#22d3ee"/><text x="10" y="4" fill="#67e8f9">Python</text></g>
    <g transform="translate(-14,24)"><text fill="#f8fafc">// building</text></g>
  </g>
  <circle r="5" fill="#f8fafc"><animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle r="14" fill="none" stroke="#f8fafc" opacity=".35"><animate attributeName="r" values="14;26;14" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0;.35" dur="2.4s" repeatCount="indefinite"/></circle>
