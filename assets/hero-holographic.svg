<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Seval Sorak holographic profile banner">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060816"/>
    <stop offset="0.45" stop-color="#10152d"/>
    <stop offset="1" stop-color="#070814"/>
  </linearGradient>
  <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6ee7f9"><animate attributeName="stop-color" values="#6ee7f9;#8b5cf6;#f472b6;#60a5fa;#6ee7f9" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset=".34" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#f472b6;#60a5fa;#6ee7f9;#8b5cf6" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset=".68" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#60a5fa;#6ee7f9;#8b5cf6;#f472b6" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#60a5fa"><animate attributeName="stop-color" values="#60a5fa;#6ee7f9;#8b5cf6;#f472b6;#60a5fa" dur="12s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".5"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow" cx=".72" cy=".4" r=".55">
    <stop offset="0" stop-color="#7dd3fc" stop-opacity=".25"/>
    <stop offset=".45" stop-color="#c084fc" stop-opacity=".14"/>
    <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <clipPath id="clip"><rect x="28" y="28" width="1144" height="364" rx="30"/></clipPath>
</defs>

<rect width="1200" height="420" fill="#050712"/>
<g>
  <rect x="28" y="28" width="1144" height="364" rx="30" fill="url(#bg)" stroke="url(#foil)" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <rect x="28" y="28" width="1144" height="364" fill="url(#glow)"/>
    <circle cx="930" cy="135" r="150" fill="#7c3aed" opacity=".14" filter="url(#blur)"/>
    <circle cx="1040" cy="290" r="140" fill="#0ea5e9" opacity=".12" filter="url(#blur)"/>
    <path d="M650 50 C790 10 915 110 1170 70" fill="none" stroke="url(#foil)" stroke-width="4" opacity=".65"/>
    <path d="M620 105 C800 40 965 190 1185 120" fill="none" stroke="url(#foil)" stroke-width="2" opacity=".35"/>
    <path d="M670 310 C850 240 965 365 1185 290" fill="none" stroke="url(#foil)" stroke-width="3" opacity=".45"/>
    <g transform="skewX(-18)">
      <rect x="-260" y="0" width="160" height="440" fill="url(#shine)" opacity=".34">
        <animate attributeName="x" values="-260;1450;-260" dur="7s" repeatCount="indefinite" keyTimes="0;.72;1"/>
      </rect>
    </g>
  </g>
</g>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="78" y="88" font-size="14" font-weight="700" fill="#cbd5e1" letter-spacing="5">AI / ML / SOFTWARE ENGINEER</text>
  <text x="76" y="182" font-size="78" font-weight="900" fill="#f8fafc" letter-spacing="-3">SEVAL</text>
  <text x="76" y="258" font-size="78" font-weight="900" fill="url(#foil)" letter-spacing="-3">SORAK</text>
  <text x="80" y="308" font-size="24" fill="#dbeafe">Building intelligent systems and real-world AI products.</text>

  <g font-size="13" font-weight="700">
    <rect x="80" y="338" width="78" height="30" rx="15" fill="#111827" stroke="#60a5fa" stroke-opacity=".7"/>
    <text x="119" y="358" fill="#dbeafe" text-anchor="middle">AI</text>
    <rect x="170" y="338" width="168" height="30" rx="15" fill="#111827" stroke="#8b5cf6" stroke-opacity=".7"/>
    <text x="254" y="358" fill="#ede9fe" text-anchor="middle">MACHINE LEARNING</text>
    <rect x="350" y="338" width="152" height="30" rx="15" fill="#111827" stroke="#f472b6" stroke-opacity=".7"/>
    <text x="426" y="358" fill="#fce7f3" text-anchor="middle">GENERATIVE AI</text>
    <rect x="514" y="338" width="184" height="30" rx="15" fill="#111827" stroke="#22d3ee" stroke-opacity=".7"/>
    <text x="606" y="358" fill="#cffafe" text-anchor="middle">SOFTWARE ENGINEERING</text>
  </g>

  <g transform="translate(868,104)">
    <circle cx="115" cy="100" r="95" fill="none" stroke="url(#foil)" stroke-width="1.5" opacity=".8"/>
    <circle cx="115" cy="100" r="62" fill="none" stroke="#7dd3fc" stroke-width="1" opacity=".4"/>
    <ellipse cx="115" cy="100" rx="95" ry="28" fill="none" stroke="#c084fc" opacity=".55">
      <animateTransform attributeName="transform" type="rotate" from="0 115 100" to="360 115 100" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="115" cy="100" rx="42" ry="95" fill="none" stroke="#38bdf8" opacity=".45">
      <animateTransform attributeName="transform" type="rotate" from="0 115 100" to="-360 115 100" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="115" cy="100" r="6" fill="#f8fafc">
      <animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</g>
</svg>